<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>FeedX</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <img src="icons/icon48.png" alt="" width="24" height="24">
    <h1>FeedX</h1>
  </header>

  <label class="toggle">
    <span>Hide feed</span>
    <input id="hideFeed" type="checkbox">
    <span class="switch" aria-hidden="true"></span>
  </label>

  <label class="toggle">
    <span>Hide LinkedIn News</span>
    <input id="hideNews" type="checkbox">
    <span class="switch" aria-hidden="true"></span>
  </label>

  <p class="note">Changes apply instantly.</p>

  <script src="settings.js"></script>
  <script src="popup.js"></script>
</body>
</html>
